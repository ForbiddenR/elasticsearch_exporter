[package]
name = "elasticsearch_exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "rt-multi-thread",
] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = "0.8"
prometheus = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mimalloc = { version = "0.1", optional = true, default-features = false }
anyhow = "1.0"
envy = "0.4"

[features]
mi-malloc = ["mimalloc"]
